name: Build MYRAA APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate MYRAA project
        id: project
        shell: bash
        run: |
          echo "Repository files:"
          find . -maxdepth 5 -type f \( \
            -name "myraa.py" -o \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) -print

          if [ -f "myraa/myraa.py" ] && [ -f "myraa/settings.gradle.kts" ]; then
            echo "dir=myraa" >> "$GITHUB_OUTPUT"
          elif [ -f "myraa/myraa.py" ] && [ -f "myraa/settings.gradle" ]; then
            echo "dir=myraa" >> "$GITHUB_OUTPUT"
          elif [ -f "myraa.py" ] && [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "myraa.py" ] && [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::MYRAA project files were not found in the expected locations."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test MYRAA backend
        working-directory: ${{ steps.project.outputs.dir }}
        run: python myraa.py test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated at $APK"
            find app/build/outputs -type f -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

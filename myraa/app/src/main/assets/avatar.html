<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
.stage{height:100%;display:flex;align-items:center;justify-content:center;perspective:900px}
.rig{position:relative;height:100%;transform-style:preserve-3d;will-change:transform}
.ly{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
</style></head>
<body><div class="stage"><div class="rig" id="rig">
<svg class="ly" data-z="-90" viewBox="0 0 400 500">
 <defs><radialGradient id="glow" cx="50%" cy="46%" r="55%"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/><stop offset="1" stop-color="#0b0f1a" stop-opacity="0"/></radialGradient></defs>
 <circle cx="200" cy="235" r="190" fill="url(#glow)"/>
 <circle id="ring" cx="200" cy="235" r="165" fill="none" stroke="#7DF9FF" stroke-width="3" stroke-dasharray="6 10" opacity="0.75"/>
 <circle id="ring2" cx="200" cy="235" r="185" fill="none" stroke="#ff7ad9" stroke-width="1.5" opacity="0.45"/>
 <g id="orbit" opacity="0"><circle cx="200" cy="50" r="6" fill="#ffd24a"/><circle cx="200" cy="50" r="6" fill="#ffd24a" transform="rotate(120 200 235)"/><circle cx="200" cy="50" r="6" fill="#ffd24a" transform="rotate(240 200 235)"/></g>
</svg>
<svg class="ly" data-z="-45" viewBox="0 0 400 500">
 <defs><linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b79cff"/><stop offset="0.6" stop-color="#e59bff"/><stop offset="1" stop-color="#ff9ad5"/></linearGradient></defs>
 <path d="M200 70 C95 70 70 170 78 250 C84 320 60 380 70 440 C100 470 135 440 140 380 L260 380 C265 440 300 470 330 440 C340 380 316 320 322 250 C330 170 305 70 200 70 Z" fill="url(#hairG)"/>
</svg>
<svg class="ly" data-z="-25" viewBox="0 0 400 500">
 <g id="body">
  <path d="M172 330 L228 330 L232 402 L168 402 Z" fill="#ffd2bd"/>
  <path d="M70 500 C70 420 120 394 168 386 Q200 424 232 386 C280 394 330 420 330 500 Z" fill="#232a55"/>
  <path d="M150 394 Q200 436 250 394" stroke="#7DF9FF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M96 440 C110 418 130 404 150 398" stroke="#ff6fb5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M304 440 C290 418 270 404 250 398" stroke="#ff6fb5" stroke-width="3" fill="none" stroke-linecap="round"/>
 </g>
</svg>
<svg class="ly" data-z="0" viewBox="0 0 400 500">
 <defs><radialGradient id="skinG" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#fff0e6"/><stop offset="1" stop-color="#ffd2bd"/></radialGradient></defs>
 <ellipse cx="200" cy="228" rx="108" ry="100" fill="url(#skinG)"/>
 <ellipse cx="136" cy="270" rx="20" ry="11" fill="#ff8fb1" opacity="0.45"/>
 <ellipse cx="264" cy="270" rx="20" ry="11" fill="#ff8fb1" opacity="0.45"/>
 <path d="M196 264 Q200 268 204 264" stroke="#e8a58f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <path id="smile" d="M180 288 Q200 306 220 288" stroke="#c2456a" stroke-width="4" fill="none" stroke-linecap="round"/>
 <ellipse id="mouthO" cx="200" cy="294" rx="13" ry="4" fill="#b83a60" opacity="0"/>
</svg>
<svg class="ly" data-z="14" viewBox="0 0 400 500">
 <defs><radialGradient id="irisG" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#7df9ff"/><stop offset="0.55" stop-color="#6a5cff"/><stop offset="1" stop-color="#2a1e7a"/></radialGradient></defs>
 <g id="eyeL"><ellipse cx="150" cy="240" rx="30" ry="36" fill="#ffffff"/>
  <g class="iris"><ellipse cx="150" cy="244" rx="22" ry="28" fill="url(#irisG)"/><ellipse cx="150" cy="248" rx="10" ry="14" fill="#1a1240"/><circle cx="141" cy="232" r="7" fill="#ffffff"/><circle cx="158" cy="256" r="3.5" fill="#ffffff" opacity="0.9"/></g>
  <path d="M118 234 Q150 196 182 234" stroke="#2b1b3d" stroke-width="7" fill="none" stroke-linecap="round"/></g>
 <g id="eyeR"><ellipse cx="250" cy="240" rx="30" ry="36" fill="#ffffff"/>
  <g class="iris"><ellipse cx="250" cy="244" rx="22" ry="28" fill="url(#irisG)"/><ellipse cx="250" cy="248" rx="10" ry="14" fill="#1a1240"/><circle cx="241" cy="232" r="7" fill="#ffffff"/><circle cx="258" cy="256" r="3.5" fill="#ffffff" opacity="0.9"/></g>
  <path d="M218 234 Q250 196 282 234" stroke="#2b1b3d" stroke-width="7" fill="none" stroke-linecap="round"/></g>
 <path d="M122 196 Q150 184 176 196" stroke="#b07bd8" stroke-width="4" fill="none" stroke-linecap="round"/>
 <path d="M224 196 Q250 184 278 196" stroke="#b07bd8" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
<svg class="ly" data-z="30" viewBox="0 0 400 500">
 <defs><linearGradient id="hairG2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b79cff"/><stop offset="1" stop-color="#e59bff"/></linearGradient></defs>
 <path d="M92 214 C92 112 150 66 200 66 C250 66 308 112 308 214 C292 176 268 158 244 164 C230 134 206 130 192 160 C172 138 142 150 130 176 C114 176 100 192 92 214 Z" fill="url(#hairG2)"/>
 <path d="M140 100 Q170 80 205 84" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
 <polygon points="262,98 266,108 277,109 269,116 271,127 262,121 253,127 255,116 247,109 258,108" fill="#ffd24a"/>
</svg>
<svg class="ly" data-z="42" viewBox="0 0 400 500">
 <path d="M96 222 C92 70 308 70 304 222" stroke="#ff6fb5" stroke-width="10" fill="none" stroke-linecap="round"/>
 <rect x="76" y="196" width="32" height="64" rx="14" fill="#ff6fb5"/><rect x="292" y="196" width="32" height="64" rx="14" fill="#ff6fb5"/>
 <circle id="cupL" cx="92" cy="228" r="9" fill="#7DF9FF"/><circle id="cupR" cx="308" cy="228" r="9" fill="#7DF9FF"/>
</svg>
<svg class="ly" data-z="70" viewBox="0 0 400 500">
 <g id="sp1" fill="#ffffff"><path d="M60 120 L64 132 L76 136 L64 140 L60 152 L56 140 L44 136 L56 132 Z"/></g>
 <g id="sp2" fill="#7DF9FF"><path d="M340 160 L343 169 L352 172 L343 175 L340 184 L337 175 L328 172 L337 169 Z"/></g>
 <g id="sp3" fill="#ffd24a"><path d="M330 330 L333 338 L341 341 L333 344 L330 352 L327 344 L319 341 L327 338 Z"/></g>
</svg>
</div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var COL={idle:'#7DF9FF',listening:'#3dff9a',thinking:'#ffd24a',speaking:'#ff7ad9',error:'#ff4d4d'};
var S={state:'idle',mouth:0,over:null,tx:0,ty:0,gx:0,gy:0,rx:0,ry:0,bs:0,nb:2,last:0};
var rig=$('rig');
function layout(){var h=rig.parentNode.clientHeight;rig.style.width=(h*0.8)+'px'}
layout();window.addEventListener('resize',layout);
[].forEach.call(document.querySelectorAll('.ly'),function(l){l.style.transform='translateZ('+l.getAttribute('data-z')+'px)'});
function pt(x,y){S.tx=(x/window.innerWidth-0.5)*2;S.ty=(y/window.innerHeight-0.5)*2}
window.addEventListener('pointermove',function(e){pt(e.clientX,e.clientY)});
window.addEventListener('touchmove',function(e){if(e.touches[0])pt(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
window.addEventListener('deviceorientation',function(e){if(e.gamma!=null&&e.beta!=null){S.gx=Math.max(-1,Math.min(1,e.gamma/30));S.gy=Math.max(-1,Math.min(1,(e.beta-45)/30))}});
function setState(s){S.state=COL[s]?s:'idle';var c=COL[S.state];$('ring').setAttribute('stroke',c);$('cupL').setAttribute('fill',c);$('cupR').setAttribute('fill',c);$('orbit').setAttribute('opacity',S.state==='thinking'?'1':'0')}
function frame(now){
 requestAnimationFrame(frame);
 if(document.hidden||now-S.last<33)return;S.last=now;
 var t=now/1000;
 var ax=S.tx||S.gx, ay=S.ty||S.gy;
 var ryT=ax*14+Math.sin(t*0.7)*3, rxT=-ay*9+Math.cos(t*0.5)*2;
 if(S.state==='speaking'){ryT+=Math.sin(t*3)*2;rxT+=Math.abs(Math.sin(t*6))*1.5}
 S.rx+=(rxT-S.rx)*0.08;S.ry+=(ryT-S.ry)*0.08;
 rig.style.transform='rotateX('+S.rx.toFixed(2)+'deg) rotateY('+S.ry.toFixed(2)+'deg)';
 $('body').setAttribute('transform','translate(0,'+(Math.sin(t*1.6)*3).toFixed(2)+')');
 var gxp=ax*4, gyp=ay*3;
 if(S.state==='thinking'){gxp=6;gyp=-6}
 [].forEach.call(document.querySelectorAll('.iris'),function(g){g.setAttribute('transform','translate('+gxp.toFixed(2)+','+gyp.toFixed(2)+')')});
 if(!S.bs&&t>S.nb){S.bs=t;S.nb=t+2+Math.random()*3}
 var sc=1;
 if(S.bs){var p=(t-S.bs)/0.18;if(p>=1){S.bs=0}else{sc=1-Math.sin(p*Math.PI)*0.9}}
 var tr='translate(0,'+(240*(1-sc)).toFixed(2)+') scale(1,'+sc.toFixed(3)+')';
 $('eyeL').setAttribute('transform',tr);$('eyeR').setAttribute('transform',tr);
 var tm=0;
 if(S.over!==null)tm=S.over;
 else if(S.state==='speaking')tm=(Math.sin(t*11)*0.5+0.5)*(0.6+0.4*Math.sin(t*3.7));
 S.mouth+=(tm-S.mouth)*0.35;
 var m=$('mouthO'),sm=$('smile');
 if(S.mouth>0.08){m.setAttribute('ry',(3+S.mouth*13).toFixed(2));m.setAttribute('rx',(11+S.mouth*4).toFixed(2));m.setAttribute('opacity','1');sm.setAttribute('opacity','0')}
 else{m.setAttribute('opacity','0');sm.setAttribute('opacity','1')}
 var spd=S.state==='thinking'?90:20;
 $('ring').setAttribute('transform','rotate('+(t*spd%360).toFixed(1)+' 200 235)');
 var r=165+(S.state==='listening'?Math.sin(t*5)*6:0);$('ring').setAttribute('r',r.toFixed(1));
 $('orbit').setAttribute('transform','rotate('+((t*180)%360).toFixed(1)+' 200 235)');
 $('sp1').setAttribute('opacity',(0.4+0.6*Math.abs(Math.sin(t*1.3))).toFixed(2));
 $('sp2').setAttribute('opacity',(0.4+0.6*Math.abs(Math.sin(t*1.7+1))).toFixed(2));
 $('sp3').setAttribute('opacity',(0.4+0.6*Math.abs(Math.sin(t*1.1+2))).toFixed(2));
}
window.MYRAA={state:setState,mouth:function(v){S.over=(typeof v==='number')?v:null}};
window.addEventListener('message',function(e){var d=e.data||{};if(d.state)setState(d.state);if(typeof d.mouth==='number')S.over=d.mouth});
setState('idle');requestAnimationFrame(frame);
})();
</script></body></html>

name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate MYRAA project files
        run: |
          echo "Repository root:"
          pwd
          echo "Searching for project files..."
          find . -maxdepth 6 -type f \( \
            -name "myraa.py" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle.kts" -o \
            -name "gradlew" \
          \) -print

      - name: Detect project directory
        id: project
        shell: bash
        run: |
          if [ -f "myraa/myraa.py" ] && [ -f "myraa/settings.gradle.kts" ]; then
            echo "dir=myraa" >> "$GITHUB_OUTPUT"
          elif [ -f "myraa.py" ] && [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not locate myraa.py and settings.gradle.kts in the expected project directories."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend self-test
        working-directory: ${{ steps.project.outputs.dir }}
        run: python myraa.py test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myraa-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
